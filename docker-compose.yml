services:
  api:
    build: .
    command: ticketflow-api
    environment:
      APP_ENV: production-skeleton
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://ticketflow:ticketflow@postgres:5432/ticketflow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ticketflow-password
      KG_BACKEND: neo4j
      SKILL_REGISTRY_BACKEND: repository
      SKILLS_DIR: skills
      ENABLE_SKILL_RUNTIME: "true"
      CLAW_TASKS_DIR: claw_tasks
      TICKETFLOW_MCP_TRANSPORT: streamable-http
      TICKETFLOW_MCP_HOST: 0.0.0.0
      TICKETFLOW_MCP_PORT: 8010
      TICKETFLOW_MCP_ALLOWED_SCOPES: read,eval
      TICKETFLOW_MCP_ENABLE_WRITE_TOOLS: "false"
      TICKETFLOW_MCP_ACTOR: docker-mcp-client
      MINIO_ENDPOINT: http://minio:9000
      ENABLE_PRODUCTION_SERVICES: "true"
    ports:
      - "8000:8000"
    volumes:
      - ticketflow-generated:/app/data/generated
    expose:
      - "8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A ticketflow.worker:celery_app worker --loglevel=INFO --pool=solo
    environment:
      APP_ENV: production-skeleton
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://ticketflow:ticketflow@postgres:5432/ticketflow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ticketflow-password
      KG_BACKEND: neo4j
      SKILL_REGISTRY_BACKEND: repository
      SKILLS_DIR: skills
      ENABLE_SKILL_RUNTIME: "true"
      CLAW_TASKS_DIR: claw_tasks
      MINIO_ENDPOINT: http://minio:9000
      ENABLE_PRODUCTION_SERVICES: "true"
    volumes:
      - ticketflow-generated:/app/data/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp:
    build: .
    command: ticketflow-platform-mcp
    environment:
      APP_ENV: production-skeleton
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://ticketflow:ticketflow@postgres:5432/ticketflow
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ticketflow-password
      KG_BACKEND: neo4j
      SKILL_REGISTRY_BACKEND: repository
      SKILLS_DIR: skills
      ENABLE_SKILL_RUNTIME: "true"
      CLAW_TASKS_DIR: claw_tasks
      TICKETFLOW_MCP_TRANSPORT: streamable-http
      TICKETFLOW_MCP_HOST: 0.0.0.0
      TICKETFLOW_MCP_PORT: 8010
      TICKETFLOW_MCP_ALLOWED_SCOPES: read,eval
      TICKETFLOW_MCP_ENABLE_WRITE_TOOLS: "false"
      TICKETFLOW_MCP_ACTOR: docker-mcp-client
      ENABLE_PRODUCTION_SERVICES: "true"
    volumes:
      - ticketflow-generated:/app/data/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/ticketflow-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ticketflow
      MINIO_ROOT_PASSWORD: ticketflow-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  ticketflow-generated:
  postgres-data:
  qdrant-data:
  neo4j-data:
  minio-data:
